name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Configure musl compiler and linker
        if: matrix.musl
        shell: bash
        run: |
          target_env="$(echo '${{ matrix.target }}' | tr '-' '_')"
          target_upper="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          echo "CC_${target_env}=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${target_upper}_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked --target "${{ matrix.target }}" --bin gry

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/gry" dist/gry
          cp LICENSE README.md dist/
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign --force --sign - dist/gry
          fi
          ./dist/gry --version
          tar -C dist -czf "dist/gry-${{ matrix.target }}.tar.gz" gry LICENSE README.md
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "gry-${{ matrix.target }}.tar.gz" > "gry-${{ matrix.target }}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "gry-${{ matrix.target }}.tar.gz" > "gry-${{ matrix.target }}.tar.gz.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gry-${{ matrix.target }}
          path: |
            dist/gry-${{ matrix.target }}.tar.gz
            dist/gry-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and include installer
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install.sh dist/install.sh
          chmod +x dist/install.sh
          (cd dist && sha256sum *.tar.gz | sort -k2 > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
